# Tiny Tapeout project information
project:
  title:        "1.25GHz SERDES VCO"                # Project title
  author:       "Samuel Ellicott"                   # Your name
  discord:      "@sellicott"                        # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "High-speed VCO for a PCIe SERDES"  # One line description of what your project does
  language:     "Analog"       # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     62500000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x2"          # Valid values for analog projects: 1x2, 2x2, 3x2, 4x2

  # How many analog pins does your project use?
  analog_pins: 2        # Valid values: 0 to 6
  uses_vapwr:  true     # Set to true if your project uses the second analog power supply (VAPWR) in addition to VDPWR (3.3V)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_gf180_sellicott_vco"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CS"
  ui[1]: "MOSI"
  ui[2]: ""
  ui[3]: "SCK"
  ui[4]: "SPI Mode"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "out[0]"
  uo[1]: "out[1]"
  uo[2]: "out[2]"
  uo[3]: "out[3]"
  uo[4]: "out[4]"
  uo[5]: "out[5]"
  uo[6]: "out[6]"
  uo[7]: "out[7]"

  # Bidirectional pins
  uio[0]: "out[ 8]/CS"
  uio[1]: "out[ 9]/MOSI"
  uio[2]: "out[10]/MISO"
  uio[3]: "out[11]/SCK"
  uio[4]: "out[12]"
  uio[5]: "out[13]"
  uio[6]: "out[14]"
  uio[7]: "out[15]"

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: "rx_p"
  ua[1]: "rx_n"
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6
